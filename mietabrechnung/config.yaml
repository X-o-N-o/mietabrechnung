name: Mietabrechnung
version: "1.2.1"
slug: mietabrechnung
description: Miete und Nebenkosten erfassen, nach Anteilen aufteilen und abrechnen
url: https://github.com/X-o-N-o/mietabrechnung
# Fertiges Image aus GitHub Actions – Home Assistant baut nicht selbst
image: ghcr.io/x-o-n-o/mietabrechnung-{arch}
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:home-city
panel_title: Mietabrechnung
# Optionaler Direktzugriff ohne Home-Assistant-Login (standardmäßig aus)
ports:
  8099/tcp: null
ports_description:
  8099/tcp: Direktzugriff auf die Weboberfläche (ohne Anmeldung)
backup: hot
# Optional: Ostrom-Zugang (developer.ostrom-api.io → Production Client) für automatische Stromkosten
options:
  ostrom_client_id: ""
  ostrom_client_secret: ""
  ostrom_contract_id: ""
schema:
  ostrom_client_id: str?
  ostrom_client_secret: password?
  ostrom_contract_id: str?
